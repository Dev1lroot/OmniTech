# OmniTech Materials Registry — single source of truth for all generators.
#
# Fields per entry:
#   name        unique identifier; % in patterns expands to this name
#   formula     chemical formula shown in item tooltip
#   colors      texture tint params (omit = no texture generation for this material)
#     dark        base/shadow colour hex
#     light       highlight colour hex
#     lum         brightness multiplier  (PIL ImageEnhance.Brightness)
#     sat         contrast  multiplier   (PIL ImageEnhance.Contrast)
#   melt_temp   minimum smelter temperature °C  (omit = no smelting/fluid)
#   density     molten fluid density kg/m³     (default 7000)
#   viscosity   molten fluid viscosity         (default 5000)
#   burns       false = fire-resistant items (melt_temp ≥ 2000)  (default true)
#   vanilla_id  full item-ID for the ingot when it lives in minecraft: namespace
#   items       item name patterns   (omit or [] = skip item generation)
#   blocks      block name patterns  (omit or [] = skip block generation)
#   tools       tool item patterns   (omit or [] = no tool texture / recipe generation)
#   armor       armor item patterns  (omit or [] = no armor texture / recipe generation)
#   tool_stats  stats for ToolSet (required when tools is non-empty)
#     durability    base uses
#     speed         mining speed multiplier
#     attack_bonus  added attack damage
#     enchantability enchantment value
#     tier          "stone" | "iron" | "diamond"
#   armor_stats stats for ArmorSet (required when armor is non-empty)
#     durability_mult  multiplier × per-slot base values
#     defense          [boots, leggings, chestplate, helmet, body]
#     enchantability   enchantment value
#     toughness        extra damage reduction
#     knockback_resistance  0.0–1.0
#
# Generators that consume this file:
#   asset_factory.py      — colors (item/block/fluid textures)
#   armor_factory.py      — armor list (armor textures)
#   tool_factory.py       — tools list (tool textures)
#   material_generator.py — items list (item data JSONs, model JSONs)
#   recipe_generator.py   — melt_temp/items (recipes + fluid/tool/armor material JSONs)

